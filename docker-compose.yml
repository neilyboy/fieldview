name: fieldview

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # localhost-only, for local dev tooling (migrations etc.)
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Built from parts so a localhost dev DATABASE_URL in .env can't leak in
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      # Image always ships Debian chromium at this path
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      UPLOAD_DIR: /data/uploads
      INTERNAL_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: production
      # Docker sets HOSTNAME to the container ID; Next standalone binds it,
      # which would refuse connections on 127.0.0.1 (needed for PDF rendering)
      HOSTNAME: 0.0.0.0
    volumes:
      - uploads:/data/uploads
    ports:
      - "${PORT:-3200}:3000"

volumes:
  pgdata:
  uploads:
